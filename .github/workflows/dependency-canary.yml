name: Dependency compatibility

on:
  schedule:
    - cron: '38 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: sympress/workflows/.github/workflows/dependency-canary.yml@9ab936c5ff11667908252eb1b788fffe00ef5ed8
    with:
      php_version: '8.5'
      run_node_build: true
