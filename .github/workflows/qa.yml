name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress:
    uses: sympress/workflows/.github/workflows/ddev-playwright.yml@cd809f3986df3ea617d2d26bdf21ab69cae19c1e
    with:
      php_version: '8.5'
      node_version: '24'
      allow_custom_commands: true
      setup_command: ddev exec bash tests/site/setup-ci.sh
      playwright_install_command: ddev exec composer --working-dir=tests/site compile-assets --mode production --no-dev --packages sympress/theme-starter && npm ci && npx playwright install --with-deps chromium
      playwright_run_command: ddev exec bash tests/site/run-ci.sh && THEME_TEST_URL=http://sympress-theme.ddev.site npm run test:browser

  workflows:
    uses: sympress/workflows/.github/workflows/lint-workflows.yml@cd809f3986df3ea617d2d26bdf21ab69cae19c1e

  php:
    name: PHP QA and translations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Package QA
        run: composer qa
      - name: Check translation catalog
        run: php scripts/extract-translations.php --check
      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

  assets:
    name: Assets and lazy chunks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for the chunk test
        run: npx playwright install --only-shell chromium
      - name: Production build
        run: npm run build
      - name: Check native preset aliases
        run: node tests/assets/check-presets.mjs
      - name: Test lazy chunks on nested routes
        run: npm run test:chunks
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
