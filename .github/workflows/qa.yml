name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    uses: sympress/workflows/.github/workflows/lint-workflows.yml@v1

  php:
    name: PHP QA and translations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Package QA
        run: composer qa
      - name: Check translation catalog
        run: php scripts/extract-translations.php --check
      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

  assets:
    name: Assets and lazy chunks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for the chunk test
        run: npx playwright install --only-shell chromium
      - name: Production build
        run: npm run build
      - name: Check generated design tokens
        run: git diff --exit-code -- resources/css/tokens.css
      - name: Test lazy chunks on nested routes
        run: npm run test:chunks
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
